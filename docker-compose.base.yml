name: "${COMPOSE_PROJECT_NAME:-napay_v2}"

services:
  gateway:
    image: caddy:2.8.4-alpine
    container_name: napay-gateway
    ports:
      - "${GATEWAY_HTTP_PORT}:80"
      - "${GATEWAY_HTTPS_PORT}:443"
    volumes:
      - ./docker/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - napay-web
      - wallet-web
    networks:
      - napay_net

  napay-web:
    image: napay/napay:dev
    container_name: napay-web
    expose:
      - "80"
    environment:
      APP_ENV: "${APP_ENV}"
    networks:
      - napay_net

  wallet-web:
    image: napay/poawallet:dev
    container_name: wallet-web
    expose:
      - "80"
    environment:
      APP_ENV: "${APP_ENV}"
      DB_DSN: "mysql:host=mysql-main;dbname=${MYSQL_DATABASE}"
      DB_USERNAME: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      WEBSOCKET_URL: "${WEBSOCKET_URL}"
      WEBSOCKET_URL_LOCALHOST: "${WEBSOCKET_URL_LOCALHOST}"
    depends_on:
      - mysql-main
      - redis-main
    networks:
      - napay_net

  pos-web:
    image: napay/pos:legacy-migrating
    container_name: pos-web
    profiles: ["legacy"]
    expose:
      - "80"
    networks:
      - napay_net

  store-wallet-web:
    image: napay/store-wallet:legacy-migrating
    container_name: store-wallet-web
    profiles: ["legacy"]
    expose:
      - "80"
    networks:
      - napay_net

  tokenpay-staging:
    image: napay/tokenpay:staging-source
    container_name: tokenpay-staging
    profiles: ["staging"]
    expose:
      - "80"
    networks:
      - napay_net

  ws-notify:
    build:
      context: ./poawallet/ws-notify
      dockerfile: Dockerfile
    container_name: wallet-ws-notify
    profiles: ["realtime"]
    environment:
      NOTIFY_WS_PORT: 14800
      REDIS_URL: redis://redis-main:6379
      NOTIFY_CHANNEL: poawallet:notify
      NOTIFY_BACKEND_URL: http://wallet-web
      NOTIFY_INTERNAL_SECRET: "${NOTIFY_INTERNAL_SECRET}"
      NOTIFY_ALLOWED_ORIGINS: "${NOTIFY_ALLOWED_ORIGINS}"
    ports:
      - "${WS_NOTIFY_HOST_PORT}:14800"
    depends_on:
      - wallet-web
      - redis-main
    networks:
      - napay_net

  mysql-main:
    image: mysql:8.0
    container_name: mysql-main
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - napay_net

  redis-main:
    image: redis:7-alpine
    container_name: redis-main
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - napay_net

  adminer:
    image: adminer:4
    container_name: napay-adminer
    profiles: ["ops"]
    ports:
      - "${ADMINER_HOST_PORT}:8080"
    depends_on:
      - mysql-main
    networks:
      - napay_net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: napay-mailhog
    profiles: ["ops"]
    ports:
      - "${MAILHOG_SMTP_HOST_PORT}:1025"
      - "${MAILHOG_UI_HOST_PORT}:8025"
    networks:
      - napay_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: napay-prometheus
    profiles: ["observability"]
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    networks:
      - napay_net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: napay-grafana
    profiles: ["observability"]
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    depends_on:
      - prometheus
    networks:
      - napay_net

networks:
  napay_net:
    name: napay_net
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
