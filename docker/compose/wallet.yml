# Wallet: poawallet. Percorsi relativi alla root del repo (vedi docker-compose.yml).
# Instradamento HTTP/WebSocket: docker/gateway/conf.d/wallet.caddy
services:
  wallet-web:
    image: napay/poawallet:dev
    # immagine costruita da poawallet/Dockerfile; target prod per i rilasci (docker build --target prod)
    build:
      context: ./poawallet
      target: dev
    container_name: wallet-web
    expose:
      - "80"
    # configurazione e segreti app (vedi poawallet/.env.example); environment sotto ha la precedenza
    env_file:
      - path: ./poawallet/.env
        required: false
    environment:
      APP_ENV: "${APP_ENV}"
      DB_DSN: "mysql:host=mysql-main;dbname=${MYSQL_DATABASE}"
      DB_USERNAME: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      WEBSOCKET_URL: "${WEBSOCKET_URL}"
      WEBSOCKET_URL_LOCALHOST: "${WEBSOCKET_URL_LOCALHOST}"
      # realtime: NotificationService pubblica su Redis, ws-notify inoltra ai browser
      REDIS_HOST: redis-main
      NOTIFY_CHANNEL: poawallet:notify
    depends_on:
      - mysql-main
      - redis-main
    networks:
      - napay_net

  ws-notify:
    build:
      context: ./poawallet/ws-notify
      dockerfile: Dockerfile
    container_name: wallet-ws-notify
    profiles: ["realtime"]
    environment:
      NOTIFY_WS_PORT: 14800
      REDIS_URL: redis://redis-main:6379
      NOTIFY_CHANNEL: poawallet:notify
      NOTIFY_BACKEND_URL: http://wallet-web
      NOTIFY_INTERNAL_SECRET: "${NOTIFY_INTERNAL_SECRET}"
      NOTIFY_ALLOWED_ORIGINS: "${NOTIFY_ALLOWED_ORIGINS}"
    ports:
      - "${WS_NOTIFY_HOST_PORT}:14800"
    depends_on:
      - wallet-web
      - redis-main
    networks:
      - napay_net

  # --- Chain di sviluppo (profilo "chain", solo locale) ---
  # Besu QBFT a nodo singolo, chainId 2118, gas zero, come la rete POA di produzione.
  # Chiavi generate al primo avvio nel volume chain_data, mai nel repository.
  # RPC interno: http://besu:8545 ; contratto TTS in /data/tts.json (servizio chain-deploy).
  chain-init:
    build: ./docker/chain/tools
    image: napay/chain-tools:dev
    profiles: ["chain"]
    command: ["node", "init.mjs"]
    environment:
      CHAIN_ID: "2118"
    volumes:
      - chain_data:/data
    networks:
      - napay_net

  besu:
    image: hyperledger/besu:26.9.0
    container_name: wallet-besu
    profiles: ["chain"]
    user: "1000:1000"
    command:
      - --data-path=/data/db
      - --genesis-file=/data/genesis.json
      - --node-private-key-file=/data/key
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT
      - --host-allowlist=*
      - --min-gas-price=0
      # nodo unico: niente discovery, nessun peer da attendere prima di produrre blocchi
      - --discovery-enabled=false
      - --sync-mode=FULL
      - --sync-min-peers=0
    volumes:
      - chain_data:/data
    depends_on:
      chain-init:
        condition: service_completed_successfully
    networks:
      - napay_net

  chain-deploy:
    build: ./docker/chain/tools
    image: napay/chain-tools:dev
    profiles: ["chain"]
    command: ["node", "deploy.mjs"]
    environment:
      CHAIN_RPC_URL: http://besu:8545
      CHAIN_ID: "2118"
    volumes:
      - chain_data:/data
    depends_on:
      - besu
    networks:
      - napay_net

volumes:
  chain_data:
