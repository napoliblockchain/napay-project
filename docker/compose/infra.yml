# Infrastruttura condivisa. Percorsi relativi alla root del repo (vedi docker-compose.yml).
services:
  gateway:
    image: caddy:2.8.4-alpine
    container_name: napay-gateway
    # in locale GATEWAY_BIND=127.0.0.1 e porte 80/443: https://wallet.local, https://napay.local
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_HTTP_PORT}:80"
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_HTTPS_PORT}:443"
    volumes:
      - ./docker/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/gateway/conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wallet-web
    networks:
      - napay_net
      # rete interna verso il backoffice napay (sandbox napay/docker/local): solo gateway e web napay
      - napay_local_browser

  mysql-main:
    image: mysql:8.0
    container_name: mysql-main
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # pronto solo quando risponde su TCP (durante l'inizializzazione il server temporaneo non ascolta in rete)
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - napay_net

  redis-main:
    image: redis:7-alpine
    container_name: redis-main
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - napay_net

  adminer:
    image: adminer:4
    container_name: napay-adminer
    profiles: ["ops"]
    ports:
      - "${ADMINER_HOST_PORT}:8080"
    depends_on:
      mysql-main:
        condition: service_healthy
    networks:
      - napay_net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: napay-mailhog
    profiles: ["ops"]
    ports:
      - "${MAILHOG_SMTP_HOST_PORT}:1025"
      - "${MAILHOG_UI_HOST_PORT}:8025"
    networks:
      - napay_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: napay-prometheus
    profiles: ["observability"]
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    networks:
      - napay_net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: napay-grafana
    profiles: ["observability"]
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    depends_on:
      - prometheus
    networks:
      - napay_net

networks:
  napay_net:
    name: napay_net
    driver: bridge
  # creata da start-localhost.sh (docker network create --internal): condivisa con il compose napay
  napay_local_browser:
    name: napay_local_browser
    external: true

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
